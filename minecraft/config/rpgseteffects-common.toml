# IridescentCraft pre-seed of Epic RPG: Class Artifacts config.
#
# The mod ships its own elite-mob system (3 ranks: Elite/Master/Legendary)
# that spawns randomly-buffed mobs dropping Set Cores. IridescentCraft already
# runs Majrusz's Progressive Difficulty for elite-tier enemies, so we zero out
# Class Artifacts' elite spawns and let LootJS feed Set Core / Fragment Core
# drops from Progressive Difficulty elites instead.

[ui]
    # Show the J-key Artifacts menu button in inventory
    showInventoryButton = true

[elite_mobs]
    # Don't display the mod's own boss bar for elite mobs — we use
    # Progressive Difficulty's elite visuals instead
    showBossBar = false
    # Entity ID blacklist for elite promotion (empty = all eligible,
    # but tier chances are zero so no promotions will happen)
    blacklist = []
    # Chance for tier 1 elite (Elite / single skull) — DISABLED
    chanceTier1 = 0.0
    # Chance for tier 2 elite (Master / double skull) — DISABLED
    chanceTier2 = 0.0
    # Chance for tier 3 elite (Legendary / triple skull) — DISABLED
    chanceTier3 = 0.0
