# =============================================================================
# IridescentCraft — ScalingMobs Per-Dimension Configuration
# Design doc: wiki/design/master.md "Scaling Configuration" (lines 350-401)
#
# Each [[health]]/[[damage]]/[[speed]] section targets specific dimensions
# using dimensionFilter. scalingType = "CONSTANT" with start = bonus fraction
# means a flat multiplier applied at all times.
#
# HP/Damage multipliers from design doc quick-reference:
#   Overworld:      1.0x (baseline, no modifier needed)
#   Twilight:       1.5x
#   Blue Skies:     2.0x
#   Aether:         2.5x
#   Undergarden:    3.0x
#   Deeper Darker:  3.5x
#   Nether:         4.0x
#   Deep Aether:    5.0x
#   End:            6.0x (single dimension — zone scaling done via KubeJS)
#
# Speed multipliers from detailed section (lines 1140-1347):
#   Overworld: 1.0x, Twilight/BS: 1.05x, Aether: 1.08x,
#   UG/DD: 1.10x, Nether: 1.12x, DA/End: 1.15x
#
# "start" = bonus as fraction of base (addOnTopOfDefault = true).
#   1.5x total → start = 0.5 (adds 50% of base)
#   2.0x total → start = 1.0 (adds 100% of base)
#   etc.
#
# Boss blacklist prevents double-scaling with Progressive Bosses.
# =============================================================================

healthAddOnTopOfDefault = true
damageAddOnTopOfDefault = true
speedAddOnTopOfDefault = true

# ── MOB BLACKLIST (same across all sections) ──
# Defined per-section via mobFilter since it's per-modifier.

# =============================================================================
# OVERWORLD — 1.0x baseline (no modifiers needed)
# =============================================================================

