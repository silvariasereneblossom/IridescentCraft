# File Specification: https://gist.github.com/Shadows-of-Fire/88ac714a758636c57a52e32ace5474c1

# Apotheosis Adventure Module Config

affixes {
    # A list of type overrides for the affix loot system.  Format is <itemname>|chance|<type>.
    # Valid types are: none, sword, trident, shield, heavy_weapon, pickaxe, shovel, crossbow, bow
    # Default: [minecraft:iron_sword|sword], [minecraft:shulker_shell|none]
    S:"Equipment Type Overrides" <
        minecraft:iron_sword|sword
        minecraft:shulker_shell|none
     >

    # The chance that a naturally spawned mob will be granted an affix item. 0 = 0%, 1 = 100%
    # Slightly increased from default (0.075) to reward exploration in modded dimensions
    # Default: 0.075; Range: [0.0 ~ 1.0]
    S:"Random Affix Chance"=0.11

    # The chance that a mob will drop a gem. 0 = 0%, 1 = 100%
    # Default: 0.045; Range: [0.0 ~ 1.0]
    S:"Gem Drop Chance"=0.045

    # The flat bonus chance that bosses have to drop a gem, added to Gem Drop Chance. 0 = 0%, 1 = 100%
    # Default: 0.33; Range: [0.0 ~ 1.0]
    S:"Gem Boss Bonus"=0.33

    # If affixes that cleave can hit players (excluding the user).
    # Default: false
    B:"Cleave Players"=false

    # Loot Rules for affix items in loot tables.
    # Format: domain:pattern|chance
    # Added all modded dimension structure patterns for tier-appropriate affix distribution
    S:"Affix Item Loot Rules" <
        minecraft:chests.*|0.35
        .*chests.*|0.30
        twilightforest:structures.*|0.40
        blue_skies:.*chests.*|0.40
        aether:.*chests.*|0.40
        deep_aether:.*chests.*|0.55
        undergarden:.*chests.*|0.45
        deeperdarker:.*chests.*|0.45
        theabyss:.*|0.45
        cataclysm:.*chests.*|0.50
        dungeons_arise:.*chests.*|0.35
        betterdungeons:.*chests.*|0.30
        betterstrongholds:.*chests.*|0.30
        betterfortresses:.*chests.*|0.45
        bettermineshafts:.*chests.*|0.25
        betteroceanmonuments:.*chests.*|0.35
        betterdeserttemples:.*chests.*|0.30
        overhauledstructures:.*chests.*|0.30
        lootintegrations:.*chests.*|0.30
     >

    # Affix Convert Loot Rules (chance an existing item in loot gets affixes)
    S:"Affix Convert Loot Rules" <
        .*blocks.*|0
        .*|0.30
     >

    # Dimensional rarities for affix conversion.
    # Format: dimension|min|max
    # Tier 1: Common-Rare (no Epic+)
    # Tier 2: Uncommon-Epic (no Mythic)
    # Tier 3: Rare-Mythic (powerful)
    # Tier 4: Epic-Ancient (endgame)
    # Design Doc Section 11 — Affix Rates by Tier:
    # Tier 1: Common/Uncommon only, max 1 socket
    # Tier 2: Common-Rare, max 2 sockets
    # Tier 3: Common-Epic, max 3 sockets
    # Tier 4: Common-Mythic, max 4+ sockets
    # NOTE: Sockets are controlled per-rarity in the datapack, not here.
    # This controls the rarity CLAMP per dimension.
    S:"Affix Convert Rarities" <
        overworld|common|uncommon
        twilightforest:twilight_forest|common|rare
        blue_skies:everbright|common|rare
        blue_skies:everdawn|common|rare
        aether:the_aether|uncommon|rare
        undergarden:undergarden|uncommon|epic
        deeperdarker:otherside|uncommon|epic
        the_nether|rare|epic
        theabyss:the_abyss|rare|epic
        deep_aether:the_aether|rare|mythic
        the_end|epic|mythic
     >

    # If Quark's Attribute Tooltip handling is disabled for affix items
    # Default: true
    B:"Disable Quark Tooltips for Affix Items"=true

    # The item that will be used when attempting to place torches with the torch placer affix.
    # Default: minecraft:torch
    S:"Torch Placement Item"=minecraft:torch
}


gems {
    # Gem Loot Rules - gems can spawn in these loot tables
    # Added modded dimension patterns
    S:"Gem Loot Rules" <
        minecraft:chests.*|0.20
        .*chests.*|0.15
        twilightforest:structures.*|0.20
        blue_skies:.*chests.*|0.20
        aether:.*chests.*|0.20
        deep_aether:.*chests.*|0.30
        undergarden:.*chests.*|0.25
        deeperdarker:.*chests.*|0.25
        theabyss:.*|0.25
        cataclysm:.*chests.*|0.30
     >

    # Gem dimensional rarities — matches affix rarity clamping
    S:"Gem Dimensional Rarities" <
        overworld|common|uncommon
        twilightforest:twilight_forest|common|rare
        blue_skies:everbright|common|rare
        blue_skies:everdawn|common|rare
        aether:the_aether|uncommon|rare
        undergarden:undergarden|uncommon|epic
        deeperdarker:otherside|uncommon|epic
        the_nether|rare|epic
        theabyss:the_abyss|rare|epic
        deep_aether:the_aether|rare|mythic
        the_end|epic|mythic
        undergarden:undergarden|rare|mythic
        deeperdarker:otherside|rare|mythic
        theabyss:the_abyss|rare|mythic
     >
}


bosses {
    # If boss items are always cursed.
    # NO — bosses are already challenging enough with our scaling
    # Default: false
    B:"Curse Boss Items"=false

    # The range at which boss spawns will be announced.
    # Default: 96.0; Range: [0.0 ~ 1024.0]
    S:"Boss Announce Range"=96.0

    # The volume of the boss announcement sound. 0 to disable.
    # Default: 0.75; Range: [0.0 ~ 1.0]
    S:"Boss Announce Volume"=0.75

    # If the boss announcement range ignores y-level.
    # Default: false
    B:"Boss Announce Ignore Y"=false

    # The time, in ticks, that must pass between any two natural boss spawns in a single dimension.
    # Design doc: boss spawn cooldown varies by dimension
    # 2400 ticks = 2 minutes. Faster than default (3600) to keep exploration engaging.
    # Default: 3600; Range: [0 ~ 720000]
    I:"Boss Spawn Cooldown"=2400

    # If true, invading bosses will automatically target the closest player.
    # YES — prevents bosses from being cheesed by staying far away
    # Default: false
    B:"Boss Auto-Aggro"=true

    # If true, bosses will glow when they spawn.
    # Default: true
    B:"Boss Glowing On Spawn"=true

    # Boss Spawn Dimensions - format: dimname|chance|rule
    # Design doc Apotheosis boss spawn rates:
    # Overworld: 2% → 0.02, Tier 2: 4% → 0.04, Tier 3: 6% → 0.06, Tier 4: 8% → 0.08, End: 10% → 0.10
    S:"Boss Spawn Dimensions" <
        minecraft:overworld|0.02|NEEDS_SKY
        minecraft:the_nether|0.06|ANY
        minecraft:the_end|0.10|SURFACE_OUTER_END
        twilightforest:twilight_forest|0.04|NEEDS_SURFACE
        blue_skies:everbright|0.04|NEEDS_SURFACE
        blue_skies:everdawn|0.04|NEEDS_SURFACE
        aether:the_aether|0.04|NEEDS_SURFACE
        deep_aether:the_aether|0.08|NEEDS_SURFACE
        undergarden:undergarden|0.06|ANY
        deeperdarker:otherside|0.06|ANY
        theabyss:the_abyss|0.06|ANY
     >

    # Boss Announce Sounds
    S:"Boss Announce Sounds" <
        block.end_portal.spawn
     >
}


worldgen {
    # The dimensions that the deadly module will generate in.
    # Only Overworld — modded dimensions have their own structures
    S:"Generation Dimension Whitelist" <
        overworld
     >
    I:"Boss Dungeon Attempts"=8
    I:"Boss Dungeon (Variant 2) Attempts"=8
    I:"Rogue Spawner Attempts"=65
    I:"Deep Rogue Spawner Attempts"=85
}


spawners {
    # The chance that a Rogue Spawner has a "valuable" chest instead of a standard one.
    # Reduced from 0.4 to 0.2 — valuable chests were too common
    # Default: 0.11; Range: [0.0 ~ 1.0]
    S:"Spawner Value Chance"=0.2
}


reforging {

    common {
        I:"Material Cost"=2
        I:"Gem Dust Cost"=2
        I:"XP Level Cost"=2
    }

    uncommon {
        I:"Material Cost"=2
        I:"Gem Dust Cost"=2
        I:"XP Level Cost"=4
    }

    rare {
        I:"Material Cost"=3
        I:"Gem Dust Cost"=3
        I:"XP Level Cost"=8
    }

    epic {
        I:"Material Cost"=3
        I:"Gem Dust Cost"=3
        I:"XP Level Cost"=12
    }

    mythic {
        I:"Material Cost"=4
        I:"Gem Dust Cost"=4
        I:"XP Level Cost"=16
    }

    ancient {
        I:"Material Cost"=5
        I:"Gem Dust Cost"=5
        I:"XP Level Cost"=20
    }

}


