# =============================================================================
# IridescentCraft Champions Ranks Configuration
# Place in: <world>/serverconfig/champions-ranks.toml
# Design doc Part II: Champions System Configuration
# =============================================================================
#
# RANK CHANCE IS MULTIPLICATIVE:
# When a hostile mob spawns, it rolls chance for Rank 1.
# If it becomes Rank 1, it then rolls chance for Rank 2.
# If it becomes Rank 2, it then rolls chance for Rank 3. Etc.
#
# With these settings, effective spawn rates are:
#   Rank 1 (1 affix):   ~8% of all hostile mobs
#   Rank 2 (2 affixes): ~2.4% (8% × 30%)
#   Rank 3 (3 affixes): ~0.48% (2.4% × 20%)
#   Rank 4 (4 affixes): ~0.048% (0.48% × 10%)
#   Total champions:    ~10.9% of all mobs
#
# DESIGN DOC TARGET RATES BY DIMENSION:
#   Overworld:         5%  | 1 affix max
#   Twilight/BS/Aether: 7-8% | 1-2 affixes
#   UG/DD/Nether/Abyss: 10-12% | 2-3 affixes
#   Deep Aether:       13% | 3-4 affixes
#   End (all zones):   14-15% | 3-4 (4 guaranteed in Dragon's Domain)
#
# Per-dimension spawn rate adjustment is NOT natively supported by
# Champions. The global rate (~11%) is a balanced compromise.
# Dimension stat scaling (1.0x-10x via ScalingMobs) provides the
# primary difficulty curve; champions are a supplemental layer.
#
# The affix COUNT per champion naturally scales with dimension tier
# because higher-tier mobs survive longer → more dangerous champions.
# A 3-affix champion in the Overworld dies in 2 hits anyway.
# =============================================================================

# Rank 1: Common Champion — Yellow nameplate
# 1 affix, mild stat boost. Common enough to be a regular occurrence.
[[ranks]]
  tier = 1
  numAffixes = 1
  defaultColor = 16776960
  chance = 0.08
  growthFactor = 2

# Rank 2: Uncommon Champion — Orange nameplate
# 2 affixes, moderate stat boost. Noticeable threat, worth engaging carefully.
[[ranks]]
  tier = 2
  numAffixes = 2
  defaultColor = 16744448
  chance = 0.30
  growthFactor = 4

# Rank 3: Rare Champion — Red nameplate
# 3 affixes, significant stat boost. Mini-boss tier. Death message on kill.
# Players should consider whether to fight or flee.
[[ranks]]
  tier = 3
  numAffixes = 3
  defaultColor = 16711680
  chance = 0.20
  growthFactor = 8

# Rank 4: Legendary Champion — Purple nameplate
# 4 affixes, massive stat boost. Extremely rare. Major threat.
# Guaranteed enchanted book drop + large XP orb.
# Permanent Resistance I effect makes them tankier.
[[ranks]]
  tier = 4
  numAffixes = 4
  defaultColor = 11141375
  chance = 0.10
  growthFactor = 14
  effects = ["minecraft:resistance;0"]
