#Minecraft server properties
#Tue Mar 17 15:59:07 EDT 2026
# PACK DEFAULTS, for a new or private server. NOT the settings of a live one.
# Who may join is decided per server and never in this file:
#   - white-list / enforce-whitelist / online-mode go on the launcher's override
#     list (icraft settings set|pin server.properties <key> ...), which writes
#     them back before every server start;
#   - whitelist.json, ops.json and the ban lists are the server's own files,
#     not part of the pack.
# A sync overwrites this file on the server, and the game drops these comment
# lines when it first saves it. Before a server is reachable from the internet,
# switch its whitelist on (or online-mode); .minecraft/dev/verify-server.ps1
# reports what a live server really runs with.
