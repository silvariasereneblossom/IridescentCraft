
[gui]
	#Show the 'Sets' button in the inventory screen.
	# Enabled: class-artifacts builds it at (guiLeft+90, guiTop+60), on top of the
	# recipe-book button; iridescent_tetra_expansion (SetsButtonAnchor) re-anchors
	# it every frame to (guiLeft+126, guiTop+64), just right of the recipe-book
	# button. It is the ONLY GUI entry point to the Set Equipment screen, where
	# the artifact + relic slots live (keybind: Alt+Y).
	showInventoryButton = true

[elite_mobs]
	#Display boss bar for elite mobs on screen.
	showBossBar = false
	#List of entity IDs that can never become elite.
	mobBlacklist = ["minecraft:creeper", "minecraft:slime", "minecraft:magma_cube", "minecraft:phantom", "minecraft:ghast", "minecraft:ender_dragon", "minecraft:wither", "minecraft:warden"]
	#Chance for elite tier 1 (Elite).
	#Range: 0.0 ~ 1.0
	chanceTier1 = 0.0
	#Chance for elite tier 2 (Master).
	#Range: 0.0 ~ 1.0
	chanceTier2 = 0.0
	#Chance for elite tier 3 (Legendary).
	#Range: 0.0 ~ 1.0
	chanceTier3 = 0.0

