
[Modifiers]
	#Use True to enable increasing difficulty by entering new dimensions.
	Enable = true
	"Enable Health Changes by Dimensions" = true
	#Each new dimension entered adds this flat HP. With 8+ dimensions,
	#this compounds. Keep low since native dimension mobs already scale.
	#0.15 per dimension = +1.2 HP after visiting all 8 dimensions.
	"Health Modifier(add)" = 0.15
	"Health Modifier(multiply)" = 0.0
	"Health Modifier(multiply_base )" = 0.0
	"Enable Damage Changes by Time" = true
	#Small damage increase per dimension visited
	"Damage Modifier(add)" = 0.05
	"Damage Modifier(multiply)" = 0.005
	"Damage Modifier(multiply_base)" = 0.0
	"Enable Armor Changes by Time" = true
	"Armor Modifier(add)" = 0.0
	"Armor Modifier(multiply)" = 0.005
	"Armor Modifier(multiply_base)" = 0.0
	"Enable Armor Toughness Changes by Time" = true
	"Armor Toughness Modifier(add)" = 0.05
	"Armor Toughness Modifier(multiply)" = 0.0
	"Armor Toughness Modifier(multiply_base)" = 0.0

