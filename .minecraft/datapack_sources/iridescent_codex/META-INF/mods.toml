modLoader="javafml"
loaderVersion="[47,)"
license="All Rights Reserved"

[[mods]]
modId="icraft"
version="1.0.0"
displayName="Iridescent Codex"
authors="Silvaria"
description='''
The Iridescent Codex — Patchouli guidebook for the IridescentCraft modpack.

modId is "icraft" to match the book.json path at
data/icraft/patchouli_books/iridescent_codex/book.json — Patchouli's
BookRegistry scans data/{modId}/patchouli_books/, so the modId MUST
match the data namespace or the book is never registered. (Earlier
attempts used modId "iridescent_codex_data" which caused Patchouli to
scan the wrong directory and throw "Invalid book" tooltips.)

Shipped as a javafml content mod with a minimal @Mod entrypoint
class, mirroring the iridescent_origins-1.0.0.jar pattern.
'''

[[dependencies.icraft]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.icraft]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="BOTH"

[[dependencies.icraft]]
    modId="patchouli"
    mandatory=true
    versionRange="[1.20.1-85,)"
    ordering="AFTER"
    side="BOTH"
