modId="iridescent_codex_data"
version="1.0.0"
displayName="Iridescent Codex"
authors="Silvaria"
description='''
The Iridescent Codex — Patchouli guidebook for the IridescentCraft modpack.

Shipped as a proper javafml content mod (mirroring iridescent_origins' pattern)
so Patchouli's BookRegistry scan finds data/icraft/patchouli_books/iridescent_codex/book.json
at mod-load time. Earlier lowcodefml attempt loaded the jar but Patchouli's
mod-iteration scanner didn't surface its data/ — hence the switch.
'''

