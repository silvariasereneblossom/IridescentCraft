# IridescentCraft pre-seed of Epic RPG: Class Artifacts config.

[gui]
    #Show the 'Sets' button in the inventory screen.
    # Fixed 2026-04-23: this key lives under [gui] per the mod's config spec
    # (Builder.push("gui") in RPGSetEffectsConfig). Earlier versions of this
    # file had it at root level, which Forge silently ignored — that's why
    # the button never appeared regardless of value. The 'use J key' comment
    # was also bogus; no such keybinding is registered by the mod.
    # Inventory button coords (from bytecode): (guiLeft+139, guiTop+67, 30x12)
    # → below the crafting grid, above the main inventory. Does NOT overlap.
    showInventoryButton = true

[elite_mobs]
    #Display boss bar for elite mobs on screen.
    # DISABLED - we use Progressive Difficulty's elite visuals instead
    showBossBar = false
    #List of entity IDs that can never become elite.
    mobBlacklist = ["minecraft:creeper", "minecraft:slime", "minecraft:magma_cube", "minecraft:phantom", "minecraft:ghast", "minecraft:ender_dragon", "minecraft:wither", "minecraft:warden"]
    #Chance for elite tier 1 (Elite). DISABLED
    chanceTier1 = 0.0
    #Chance for elite tier 2 (Master). DISABLED
    chanceTier2 = 0.0
    #Chance for elite tier 3 (Legendary). DISABLED
    chanceTier3 = 0.0
