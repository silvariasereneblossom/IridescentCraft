# This is the configuration file for Canary.
# This file exists for debugging purposes and should not be configured otherwise.
# Before configuring anything, take a backup of the worlds that will be opened.
#
# You can find information on editing this file and all the available options here:
# https://github.com/AbdElAziz333/Canary/wiki/Configuration-File
#
# By default, this file will be empty except for this notice.

# 2026-06-06 (MIX-5-001): disable canary's alloc.chunk_ticking redirect so
# servercore's full tick-chunks optimization (noList -> CachedChunkList) wins
# the ServerChunkCache @Redirect instead of being silently skipped. This is the
# family-level key; canary has NO per-class toggle and silently ignores unknown
# keys, so mixin.alloc.chunk_ticking.ServerChunkCacheMixin would be a no-op.
mixin.alloc.chunk_ticking=false
