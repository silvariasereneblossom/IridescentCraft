
[Misc]
	#The amount by which mobs scale, per Minecraft day
	#Range: 0.0 ~ Infinity
	"Scaling Speed" = 1.0
	#Players with lower scale will receive a higher boost to their stats
	#Setting this to 0 disables the feature
	#Range: 0.0 ~ Infinity
	"Player Scale Favor" = 10.0
	#If true, mob stats will increase exponentially
	# 2026-04-25: flipped to true. Combined with halved per-day scale rates,
	# this gives the curve we want: gentle early days, steeper late game.
	# Linear at 0.03/day = 1.9x HP at day 30, 2.8x at day 60. Exponential
	# at 0.015/day = ~1.56x at day 30, ~2.45x at day 60 — but the SHAPE of
	# growth is concave-up, so day 1-7 mobs are nearly vanilla while day 60+
	# bites harder than the linear equivalent at the same midpoint.
	"Use Exponential Scaling" = true
	#If true, mob scaling speed will increase with more players in the world, up to 2x with 5 players
	#Scaling will also cease if no players are on the server
	"Scale with Player Count" = true
	#After this day in the Minecraft world, all hostile mobs will be immune to burning in daylight
	#Range: > 0
	# 2026-04-24: was 7. Flipped to 999999 (effectively disabled) so the
	# daytime sunlight-burn remains a permanent danger. Design doc: night
	# dangerous, well-lit bases safe, daytime outside purges undead.
	# Aggression is further boosted by kubejs/server_scripts/sunlight_smite.js
	# which applies extra damage to #minecraft:undead-tagged mobs exposed
	# to direct sky. Keeping them vulnerable to base burn is part of that.
	"Mobs Stop Burning on Day" = 999999
	#A list of mobs that will scale, even if they're not monsters
	"Mob Whitelist" = []
	#A list of mobs that will not scale, even if they're monsters
	"Mob Blacklist" = []

[Health]
	#The decimal amount that hostile mobs' health increase per day
	#Range: 0.0 ~ Infinity
	# 2026-04-25: halved from 0.03 to 0.015 alongside flipping
	# Use Exponential Scaling = true for the easier-early/harder-late curve.
	"Health Scale Rate" = 0.015
	#The decimal amount of the mobs' base health in the beginning
	#Range: 0.0 ~ Infinity
	"Mob Health Base" = 0.0
	#The maximum amount that hostile mobs' damage can scale to
	#Range: 0.0 ~ Infinity
	"Max Scaled Health" = +inf

[Damage]
	#The decimal amount that hostile mobs' damage increase per day
	#Range: 0.0 ~ Infinity
	# 2026-04-25: halved 0.015 -> 0.0075 to match the easier-early curve.
	"Damage Scale Rate" = 0.0075
	#The decimal amount of the mobs' base damage in the beginning
	#Range: 0.0 ~ Infinity
	"Mob Damage Base" = 0.0
	#The maximum amount that hostile mobs' damage can scale to
	#Range: 0.0 ~ Infinity
	"Max Scaled Damage" = 0.2

[Speed]
	#The decimal amount that hostile mobs' speed increase per day
	#Range: 0.0 ~ Infinity
	# 2026-04-25: halved 0.005 -> 0.0025 (easier-early curve).
	"Speed Scale Rate" = 0.0025
	#The decimal amount of the mobs' base speed in the beginning
	#Range: 0.0 ~ Infinity
	"Mob Speed Base" = 0.0
	#The maximum amount that hostile mobs' speed can scale to
	#Range: 0.0 ~ Infinity
	"Max Scaled Speed" = 1.0

["Armor Piercing"]
	#The decimal amount of increase to mobs' damage that ignores armor per day
	#Range: 0.0 ~ Infinity
	# 2026-04-25: halved 0.01 -> 0.005 (easier-early curve).
	"Armor Piercing Scale Rate" = 0.005
	#The decimal amount of mobs' damage that ignores armor in the beginning
	#Range: 0.0 ~ Infinity
	"Armor Piercing Base" = 0.0
	#The maximum amount of increase to mobs' damage that ignores armor
	#Range: 0.0 ~ Infinity
	"Max Scaled Armor Piercing" = 1.0

[Drops]
	#The decimal amount of increase to mobs' drops per day
	#Range: 0.0 ~ Infinity
	"Mob Drops Scaling Rate" = 0.05
	#The decimal amount of mobs' drops in the beginning
	#Range: 0.0 ~ Infinity
	"Mob Drops Base" = 0.0
	#The maximum amount of increase to mobs' drops
	#Range: 0.0 ~ Infinity
	"Max Scaled Mob Drops" = 400.0
	#The decimal amount of increase to mobs' XP drops per day
	#Range: 0.0 ~ Infinity
	"Mob XP Scaling Rate" = 0.05
	#The decimal amount of mobs' XP drops in the beginning
	#Range: 0.0 ~ Infinity
	"Mob XP Base" = 0.0
	#The maximum amount of increase to mobs' XP drops
	#Range: 0.0 ~ Infinity
	"Max Scaled Mob XP" = 400.0

