# File Specification: https://gist.github.com/Shadows-of-Fire/88ac714a758636c57a52e32ace5474c1

# Apotheosis Adventure Module Config

affixes {
    # A list of type overrides for the affix loot system.  Format is <itemname>|chance|<type>.
    # Valid types are: none, sword, trident, shield, heavy_weapon, pickaxe, shovel, crossbow, bow
    # Default: [minecraft:iron_sword|sword], [minecraft:shulker_shell|none]
    S:"Equipment Type Overrides" <
        minecraft:iron_sword|sword
        minecraft:shulker_shell|none
        # NOTE 2026-05-18: spellbooks are NO LONGER typed as sword here.
        # Path A (this config) was replaced by Path B - spellbooks live in
        # a dedicated `magic_weapon` LootCategory registered at runtime by
        # kubejs/startup_scripts/magic_weapon_category.js, with membership
        # via the #icraft:magic_weapon item tag. Reason: Path A made any
        # gem JSON that added a sword/trident bonus collide with canonical
        # sword/trident bonuses (Collectors.toMap throws on duplicate
        # LootCategory key), which broke 6 of our 11 elemental gem
        # overrides at datapack-load time.

        # ====================================================================
        # 2026-05-19 Terramity audit (Phase 4/5 closure): 26 drops mapped
        # to LootCategories for reforging + socketing.
        # See wiki/design/master-appendix.md sec M.10 + recipe_audit.js section I.
        # ====================================================================
        # 7 audit weapons -> sword (these extend Item directly, not SwordItem,
        # so they need explicit routing). 6 are guns + 1 is the UnholyLance.
        terramity:blasphemic_rapture|sword
        terramity:davy_jones|sword
        terramity:divine_intervention|sword
        terramity:kamehameha|sword
        terramity:olympus|sword
        terramity:planet_buster|sword
        terramity:unholy_lance|sword
        # Tomes (6) -> magic_weapon: routes through the wand/staff affix pool.
        # Thematic-only fit -- the tomes' use-time effects are hardcoded (not
        # spell_power-scaled), but cooldown_reduction may apply to right-click
        # cooldowns where present. gaias_tempest was originally listed here,
        # decompile showed it's actually a 2-handed rocket launcher (reload
        # cycle + GeoItem armPose); moved to crossbow below.
        terramity:tome_of_commotion|magic_weapon
        terramity:tome_of_ascension|magic_weapon
        terramity:galebounce_tome|magic_weapon
        terramity:dimensional_poof|magic_weapon
        terramity:velocity_flip|magic_weapon
        terramity:guardian_grimoire|magic_weapon

        # Ranged held weapons (2): decompile confirmed both have reload
        # mechanics + GeoItem pose; they're firearms, not curios. Originally
        # routed as helmet (fortunes_favor) / magic_weapon (gaias_tempest);
        # corrected 2026-05-19 after curio survey.
        # - fortunes_favor: rapid-fire gambling pistol with roll-based ammo
        #   selection (dart/pistol/rifle/shotgun/large rifle/antimatter rifle)
        #   -> bow (sustained-fire shape, rapid_fire affix pool)
        # - gaias_tempest: 2-handed rocket launcher with reload cycle
        #   -> crossbow (load/fire shape, multishot/piercing affix pool)
        terramity:fortunes_favor|bow
        terramity:gaias_tempest|crossbow

        # Bracelets/bands (5) -> shield: routes through defensive curio pool
        terramity:sacred_speed_bracelets|shield
        terramity:electron_bracelets|shield
        terramity:malediction_bracelets|shield
        terramity:exodium_twin_bracelets|shield
        terramity:dragon_band|shield

        # Necklaces/amulets/pacemaker (3) -> chestplate: chest-slot curios get
        # heavier affix budget consistent with main armor
        terramity:nyxs_necklace|chestplate
        terramity:exodium_shield_amulet|chestplate
        terramity:antimatter_pacemaker|chestplate

        # Head-slot curios (1) + 1 antiprism (2 total) -> helmet.
        # fortunes_favor moved out; see bow/crossbow block above.
        terramity:null_scarf|helmet
        terramity:antiprism|helmet

        # Foot-slot curio (1) -> boots
        terramity:angel_feather|boots
     >

    # The chance that a naturally spawned mob will be granted an affix item. 0 = 0%, 1 = 100%
    # Slightly increased from default (0.075) to reward exploration in modded dimensions
    # Default: 0.075; Range: [0.0 ~ 1.0]
    S:"Random Affix Chance"=0.11

    # The chance that a mob will drop a gem. 0 = 0%, 1 = 100%
    # Default: 0.045; Range: [0.0 ~ 1.0]
    S:"Gem Drop Chance"=0.045

    # The flat bonus chance that bosses have to drop a gem, added to Gem Drop Chance. 0 = 0%, 1 = 100%
    # Default: 0.33; Range: [0.0 ~ 1.0]
    S:"Gem Boss Bonus"=0.33

    # If affixes that cleave can hit players (excluding the user).
    # Default: false
    B:"Cleave Players"=false

    # Loot Rules for affix items in loot tables.
    # Format: domain:pattern|chance
    # NOTE: Affix Item rules generate NEW affix items. Unlike Convert rules,
    # they are NOT clamped by "Affix Convert Rarities" — items can roll any rarity.
    # To prevent Rare+ affixes in Overworld, the generic catch-all chances are kept
    # low. Modded dimension patterns below add higher chances where appropriate.
    # If Rare (blue) affixes still appear in Overworld chests, this is the source.
    S:"Affix Item Loot Rules" <
        minecraft:chests.*|0.25
        .*chests.*|0.20
        twilightforest:structures.*|0.40
        blue_skies:.*chests.*|0.40
        aether:.*chests.*|0.40
        deep_aether:.*chests.*|0.55
        undergarden:.*chests.*|0.45
        deeperdarker:.*chests.*|0.45
        theabyss:.*|0.45
        cataclysm:.*chests.*|0.50
        dungeons_arise:.*chests.*|0.35
        betterdungeons:.*chests.*|0.30
        betterstrongholds:.*chests.*|0.30
        betterfortresses:.*chests.*|0.45
        bettermineshafts:.*chests.*|0.25
        betteroceanmonuments:.*chests.*|0.35
        betterdeserttemples:.*chests.*|0.30
        overhauledstructures:.*chests.*|0.30
        lootintegrations:.*chests.*|0.30
     >

    # Affix Convert Loot Rules (chance an existing item in loot gets affixes)
    S:"Affix Convert Loot Rules" <
        .*blocks.*|0
        .*|0.40
     >

    # Dimensional rarities for affix conversion.
    # Format: dimension|min|max
    # 2026-05-14: Apotheosis workstations ungated (see
    # astages_restrictions.js). Gate is now the rarity ladder ONLY.
    # All clamps bumped one tier to match observed natural-spawn ceilings;
    # convert path was systematically more restrictive than fresh spawns.
    # Sockets are still controlled per-rarity in the datapack.
    # Tier 1 (Overworld):                  Common-Rare
    # Tier 2 (TF / BS / Aether):           Common-Epic
    # Tier 3 (Nether / UG / DD / Abyss):   Up to Mythic
    # Tier 4 (End / Deep Aether):          Up to Ancient
    S:"Affix Convert Rarities" <
        minecraft:overworld|common|rare
        twilightforest:twilight_forest|common|epic
        blue_skies:everbright|common|epic
        blue_skies:everdawn|common|epic
        aether:the_aether|uncommon|epic
        undergarden:undergarden|uncommon|mythic
        deeperdarker:otherside|uncommon|mythic
        minecraft:the_nether|rare|mythic
        theabyss:the_abyss|rare|mythic
        deep_aether:the_aether|rare|ancient
        minecraft:the_end|epic|ancient
     >

    # If Quark's Attribute Tooltip handling is disabled for affix items
    # Default: true
    B:"Disable Quark Tooltips for Affix Items"=true

    # The item that will be used when attempting to place torches with the torch placer affix.
    # Default: minecraft:torch
    S:"Torch Placement Item"=minecraft:torch
}


gems {
    # Gem Loot Rules - gems can spawn in these loot tables
    # Added modded dimension patterns
    S:"Gem Loot Rules" <
        minecraft:chests.*|0.30
        .*chests.*|0.25
        twilightforest:structures.*|0.20
        blue_skies:.*chests.*|0.20
        aether:.*chests.*|0.20
        deep_aether:.*chests.*|0.30
        undergarden:.*chests.*|0.25
        deeperdarker:.*chests.*|0.25
        theabyss:.*|0.25
        cataclysm:.*chests.*|0.30
     >

    # Gem dimensional rarities — matches affix rarity clamping
    # 2026-05-14: All clamps bumped one tier to match natural ceilings.
    S:"Gem Dimensional Rarities" <
        minecraft:overworld|common|rare
        twilightforest:twilight_forest|common|epic
        blue_skies:everbright|common|epic
        blue_skies:everdawn|common|epic
        aether:the_aether|uncommon|epic
        undergarden:undergarden|uncommon|mythic
        deeperdarker:otherside|uncommon|mythic
        minecraft:the_nether|rare|mythic
        theabyss:the_abyss|rare|mythic
        deep_aether:the_aether|rare|ancient
        minecraft:the_end|epic|ancient
     >
}


bosses {
    # If boss items are always cursed.
    # NO — bosses are already challenging enough with our scaling
    # Default: false
    B:"Curse Boss Items"=false

    # The range at which boss spawns will be announced.
    # Default: 96.0; Range: [0.0 ~ 1024.0]
    S:"Boss Announce Range"=96.0

    # The volume of the boss announcement sound. 0 to disable.
    # Default: 0.75; Range: [0.0 ~ 1.0]
    S:"Boss Announce Volume"=0.75

    # If the boss announcement range ignores y-level.
    # Default: false
    B:"Boss Announce Ignore Y"=false

    # The time, in ticks, that must pass between any two natural boss spawns in a single dimension.
    # Design doc: boss spawn cooldown varies by dimension
    # 2400 ticks = 2 minutes. Faster than default (3600) to keep exploration engaging.
    # Default: 3600; Range: [0 ~ 720000]
    I:"Boss Spawn Cooldown"=2400

    # If true, invading bosses will automatically target the closest player.
    # YES — prevents bosses from being cheesed by staying far away
    # Default: false
    B:"Boss Auto-Aggro"=true

    # If true, bosses will glow when they spawn.
    # Default: true
    B:"Boss Glowing On Spawn"=true

    # Boss Spawn Dimensions - format: dimname|chance|rule
    # Design doc Apotheosis boss spawn rates:
    # Overworld: 2% → 0.02, Tier 2: 4% → 0.04, Tier 3: 6% → 0.06, Tier 4: 8% → 0.08, End: 10% → 0.10
    S:"Boss Spawn Dimensions" <
        minecraft:overworld|0.02|NEEDS_SKY
        minecraft:the_nether|0.08|ANY
        minecraft:the_end|0.10|SURFACE_OUTER_END
        twilightforest:twilight_forest|0.04|NEEDS_SURFACE
        blue_skies:everbright|0.04|NEEDS_SURFACE
        blue_skies:everdawn|0.04|NEEDS_SURFACE
        aether:the_aether|0.04|NEEDS_SURFACE
        deep_aether:the_aether|0.08|NEEDS_SURFACE
        undergarden:undergarden|0.06|ANY
        deeperdarker:otherside|0.06|ANY
        theabyss:the_abyss|0.06|ANY
     >

    # Boss Announce Sounds
    S:"Boss Announce Sounds" <
        block.end_portal.spawn
     >
}


worldgen {
    # The dimensions that the deadly module will generate in.
    # Only Overworld — modded dimensions have their own structures
    S:"Generation Dimension Whitelist" <
        minecraft:overworld
     >
    I:"Boss Dungeon Attempts"=8
    I:"Boss Dungeon (Variant 2) Attempts"=8
    I:"Rogue Spawner Attempts"=65
    I:"Deep Rogue Spawner Attempts"=85
}


spawners {
    # The chance that a Rogue Spawner has a "valuable" chest instead of a standard one.
    # Reduced from 0.4 to 0.2 — valuable chests were too common
    # Default: 0.11; Range: [0.0 ~ 1.0]
    S:"Spawner Value Chance"=0.2
}


reforging {

    common {
        I:"Material Cost"=2
        I:"Gem Dust Cost"=2
        I:"XP Level Cost"=2
    }

    uncommon {
        I:"Material Cost"=2
        I:"Gem Dust Cost"=2
        I:"XP Level Cost"=4
    }

    rare {
        I:"Material Cost"=3
        I:"Gem Dust Cost"=3
        I:"XP Level Cost"=8
    }

    epic {
        I:"Material Cost"=3
        I:"Gem Dust Cost"=3
        I:"XP Level Cost"=12
    }

    mythic {
        I:"Material Cost"=4
        I:"Gem Dust Cost"=4
        I:"XP Level Cost"=16
    }

    ancient {
        I:"Material Cost"=5
        I:"Gem Dust Cost"=5
        I:"XP Level Cost"=20
    }

}


