# =============================================================================
# IridescentCraft — Improved Mobs Configuration
# Place in: config/improvedmobs-common.toml
#
# Design doc Part II: Mob Behavior per Dimension Tier
#
# IMPORTANT: Improved Mobs does NOT support per-dimension configuration.
# It uses a GLOBAL difficulty system. The design doc specifies:
#   Tier 1 (OW):    Basic AI — no gear, no block break, no coordination
#   Tier 2 (TF/BS): 20% equip weapons, better pathfinding, slight aim lead
#   Tier 3 (Nether): ALL mobs use gear, break weak blocks, flanking AI
#   Tier 4 (End):    Maximum — break any block, coordinate, adapt to player
#
# Since we can't do per-dimension, we configure IM at a MODERATE level
# that feels right for Tier 2-3 (the bulk of gameplay). Tier 1 is already
# easy due to low ScalingMobs multipliers, and Tier 4 gets its challenge
# from the extreme stat scaling rather than needing maximum IM features.
#
# Difficulty system is set to scale with DISTANCE from spawn + time,
# which naturally makes dimensions further in progression harder.
# =============================================================================

[general]
    # Difficulty increases over time and with distance from spawn
    # GLOBAL = one server-wide value. We use PLAYERMEAN for multiplayer balance.
    #Allowed Values: GLOBAL, PLAYERMAX, PLAYERMEAN
    "Difficulty type" = "PLAYERMEAN"

    # Starting difficulty (0-250 range). Start at 0 for fresh worlds.
    "Starting Difficulty" = 0.0

    # Maximum difficulty cap. Default 250, we cap at 200 to prevent
    # late-game from becoming unplayable (ScalingMobs already handles scaling).
    "Difficulty Max" = 200.0

    # Difficulty increase per in-game day (24000 ticks).
    # Default is 1.5. We use 1.0 for slower ramp — players need time to
    # gear up between tiers. At 1.0/day, reaching max takes ~200 days.
    "Difficulty Increase" = 1.0

    # Difficulty decrease when player dies. Provides slight mercy mechanic.
    # Design doc doesn't specify this but 1.5 penalty reduction helps prevent
    # frustration spirals in Tier 3-4 dimensions.
    "Difficulty Decrease" = 1.5

    # Whether difficulty can go below 0. No — we never want negative difficulty.
    "Allow negative Difficulty" = false

    # Ignore mobs from spawners (dungeon spawners, etc.)
    # FALSE — dungeon spawners SHOULD produce enhanced mobs. Design doc says
    # "dungeon spawners should produce champions for challenge" (same principle).
    "Ignore Spawner Mobs" = false

    # Ignore mobs from mob spawners only (not natural spawns).
    # We want all mobs affected.
    "Ignore Mob Spawner" = false

    # Pet protection — players can't hurt pets unless sneaking
    # YES — quality of life, prevents accidental pet kills in chaotic fights
    "Pet Protection" = true

    # Pet armor — players can give pets armor by shift-right-clicking
    "Pet Armor" = true

    # Difficulty notification type
    #Allowed Values: NONE, PERCENT, ABSOLUTE
    "Difficulty Notification" = "PERCENT"

[ai]
    # ── FLAG-BASED FEATURES ──
    # These control which AI behaviors are enabled GLOBALLY.
    # Flags: ALL, ATTRIBUTES, ARMOR, HELDITEMS, BLOCKBREAK, USEITEM,
    #        LADDER, STEAL, GUARDIAN, PARROT, TARGETVILLAGER, NEUTRALAGGRO

    # ATTRIBUTES: Mobs gain stat bonuses (HP, damage, speed, knockback resist)
    # based on difficulty. YES — this is the core feature.
    # Note: This stacks with ScalingMobs! We keep IM attribute scaling LOW
    # to avoid double-dipping.
    "Enable Attributes" = true

    # ARMOR: Mobs can spawn with armor from any mod.
    # YES — design doc says Tier 2+ mobs should equip gear.
    # At low difficulty (Overworld), armor chance is naturally low.
    "Enable Armor" = true

    # HELDITEMS: Mobs can spawn with weapons from any mod.
    # YES — same reasoning as armor.
    "Enable Held Items" = true

    # BLOCKBREAK: Mobs break blocks to reach players.
    # YES — design doc specifies Nether mobs break weak blocks,
    # End mobs break any block. At low difficulty this barely triggers.
    "Enable Block Breaking" = true

    # Block break whitelist — which blocks CAN be broken.
    # Design doc Tier 3: "break weak blocks (wood, glass)"
    # Design doc Tier 4: "break any block (including obsidian, slowly)"
    # We whitelist only weak blocks since IM is global. Obsidian breaking
    # would grief Overworld bases. Players in T4 have other challenges.
    "Block Break Whitelist" = ["minecraft:glass", "minecraft:glass_pane", "#minecraft:planks", "#minecraft:wooden_doors", "#minecraft:wooden_trapdoors", "#minecraft:fence_gates", "minecraft:torch", "minecraft:wall_torch", "#minecraft:wool", "minecraft:cobweb", "#minecraft:leaves"]

    # Block break speed multiplier (higher = faster breaking)
    # Keep moderate — we don't want instant wood destruction
    "Block Break Speed" = 1.0

    # Whether mobs break blocks when idle (no target)
    # NO — only break blocks when actively pursuing a player
    "Break Blocks When Idle" = false

    # Restore broken blocks after delay (seconds). 0 = disabled.
    # 120 seconds = blocks regenerate after 2 minutes.
    # Prevents permanent terrain destruction while maintaining threat.
    "Restore Broken Blocks Delay" = 120

    # USEITEM: Mobs can use items (enchanted books = buff aura, etc.)
    # YES — adds variety to mob encounters
    "Enable Use Item" = true

    # LADDER: Mobs actively climb ladders to reach players.
    # YES — basic mobility improvement, important for dungeon combat
    "Enable Ladder Climbing" = true

    # STEAL: Mobs loot from player-opened chests when idle.
    # NO — too annoying for a modpack with extensive storage systems.
    # Players use Refined Storage/AE2 which mobs can't interact with anyway.
    "Enable Stealing" = false

    # GUARDIAN: Water mobs can summon guardian mounts.
    # YES but low chance — adds aquatic threat without being oppressive
    "Enable Guardian Mount" = true
    "Guardian Mount Chance" = 0.05

    # PARROT: Mobs can summon flying mounts to reach unreachable targets.
    # YES — design doc says flying mobs are common in Aether/Deep Aether.
    # Low chance keeps it from being overwhelming.
    "Enable Parrot Mount" = true
    "Parrot Mount Chance" = 0.03

    # TARGETVILLAGER: Non-zombie mobs also target villagers.
    # YES — design doc doesn't mention this but it adds world danger
    "Enable Target Villager" = true

    # NEUTRALAGGRO: Neutral mobs (endermen, etc.) can spawn aggressive.
    # YES — design doc says Nether has "permanently aggro from 20 blocks".
    # Global chance is low; natural dimension aggro handles the rest.
    "Enable Neutral Aggro" = true
    "Neutral Aggro Chance" = 0.10

[attributes]
    # ── ATTRIBUTE SCALING ──
    # These define HOW MUCH stats increase with difficulty.
    # CRITICAL: ScalingMobs ALREADY handles dimension-based stat scaling.
    # IM attributes stack ON TOP of ScalingMobs. We keep these LOW
    # to avoid compounding effects:
    #   ScalingMobs: 1.0x-10x by dimension (primary scaling)
    #   Improved Mobs: +0-20% by difficulty (secondary, time-based)
    #
    # This means early Overworld mobs are baseline, but late-game
    # Overworld mobs (after 100+ days) are slightly tougher — rewarding
    # progression without making old areas trivially easy forever.

    # Health increase per difficulty point (percentage).
    # At max difficulty (200), mobs gain +20% HP. Modest on top of ScalingMobs.
    "Health Increase" = 0.001

    # Damage increase per difficulty point.
    # At max difficulty (200), mobs gain +16% damage.
    "Damage Increase" = 0.0008

    # Speed increase per difficulty point.
    # At max difficulty (200), mobs gain +6% speed. Keep low — speed is
    # the most frustrating stat to scale. Fast mobs feel unfair.
    "Speed Increase" = 0.0003

    # Knockback resistance increase per difficulty point.
    # At max difficulty (200), mobs gain +20% knockback resist.
    "Knockback Resistance Increase" = 0.001

    # Magic resistance (not a default IM config but referenced in some versions)
    # Left at default if present

    # Armor increase per difficulty point.
    # At max difficulty (200), mobs gain +4 armor points.
    "Armor Increase" = 0.02

    # Projectile damage multiplier per difficulty
    "Projectile Damage Increase" = 0.0005

[equipment]
    # ── EQUIPMENT CONFIGURATION ──
    # Controls what gear mobs can spawn with.
    # Design doc specifies per-tier equipment:
    #   Tier 1: No mob gear
    #   Tier 2: 20-25% with iron-tier
    #   Tier 3: 40-50% with diamond-tier
    #   Tier 4: 60-80% with netherite-tier
    #
    # IM uses difficulty to scale equipment quality. At low difficulty
    # (Overworld), mobs get leather/iron. At high difficulty, diamond/netherite.
    # The base equip chance controls how many mobs get gear at all.

    # Base chance for a mob to spawn with any equipment (0.0-1.0)
    # 30% is a balanced starting point. Difficulty scales quality, not quantity.
    "Equipment Chance" = 0.30

    # Whether to apply enchantments to equipment
    # YES — design doc says Tier 3+ mobs have enchanted gear
    "Enable Enchantments" = true

    # Max enchantment level scaling with difficulty
    # At low difficulty: level 1-2 enchants. At high: up to level 4-5.
    "Enchantment Level Scale" = 0.02

    # Equipment drop chance when mob is killed (0.0-1.0)
    # Low — we don't want IM equipment flooding the economy.
    # Design doc loot system is handled by loot_overhaul.js separately.
    "Equipment Drop Chance" = 0.05

[list]
    # ── ENTITY LIST ──
    # By default IM modifies all hostile mobs (EntityMob subclasses).
    # We BLACKLIST bosses to prevent double-scaling with Progressive Bosses.
    # Format: "modid:entity" or "modid:entity-FLAG1,FLAG2" to exclude flags
    #
    # Using blacklist mode: entities listed here are EXCLUDED from IM.
    "List Type" = "BLACKLIST"

