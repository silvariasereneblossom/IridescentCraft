
#Iridescent Difficulty — bespoke time-based mob scaling per dimension.
#Magnitudes are percentages of vanilla baseline (100 = 1.0x).
#Each dimension has a tier (t1..t4) with a start%, cap%, and capHours.
#Multiplier interpolates linearly between start and cap as the dimension's
#loaded-time timer ticks up. The End uniquely uncaps after killing the
#Ender Dragon (configurable per dimension via uncapAfterEnderDragon).
#
#Boss scaling stacks ON TOP via ProgressiveBosses + boss_progressive.js.
[general]
	#Master toggle. Set false to disable all scaling (e.g., for QA).
	enabled = true
	#Apply multiplier to max_health.
	scaleHealth = true
	#Apply multiplier to attack_damage.
	scaleDamage = true
	#Apply multiplier to armor.
	scaleArmor = true
	#Apply sqrt(multiplier) to movement_speed.
	scaleSpeed = true

[tiers]

	#T1 — Overworld. Starts hardish for tier-1 scaling classes; manageable.
	[tiers.t1]
		#Starting multiplier % (100 = 1.0x vanilla)
		#Range: 50.0 ~ 10000.0
		startPct = 150.0
		#Cap multiplier % (must be >= startPct)
		#Range: 50.0 ~ 10000.0
		capPct = 300.0
		#Hours of dimension-loaded time to reach cap from start.
		#Range: 0.1 ~ 10000.0
		capHours = 100.0
		#Extra multiplier applied ONLY to attack_damage, on top of the start/cap
		#curve (health/armor/speed unaffected). 130 = +30% incoming damage.
		#Range: 50.0 ~ 10000.0
		damageMultiplierPct = 130.0

	#T2 — Twilight Forest, Blue Skies, The Aether.
	[tiers.t2]
		#Starting multiplier % (100 = 1.0x vanilla)
		#Range: 50.0 ~ 10000.0
		startPct = 200.0
		#Cap multiplier % (must be >= startPct)
		#Range: 50.0 ~ 10000.0
		capPct = 350.0
		#Hours of dimension-loaded time to reach cap from start.
		#Range: 0.1 ~ 10000.0
		capHours = 100.0
		#Extra multiplier applied ONLY to attack_damage, on top of the start/cap
		#curve (health/armor/speed unaffected). 130 = +30% incoming damage.
		#Range: 50.0 ~ 10000.0
		damageMultiplierPct = 130.0

	#T3 — Undergarden, Deeper Darker, Nether, The Abyss.
	[tiers.t3]
		#Starting multiplier % (100 = 1.0x vanilla)
		#Range: 50.0 ~ 10000.0
		startPct = 300.0
		#Cap multiplier % (must be >= startPct)
		#Range: 50.0 ~ 10000.0
		capPct = 450.0
		#Hours of dimension-loaded time to reach cap from start.
		#Range: 0.1 ~ 10000.0
		capHours = 100.0
		#Extra multiplier applied ONLY to attack_damage, on top of the start/cap
		#curve (health/armor/speed unaffected). 130 = +30% incoming damage.
		#Range: 50.0 ~ 10000.0
		damageMultiplierPct = 130.0

	#T4 — Deep Aether, The End. Hard regardless. End uncaps after Ender Dragon kill.
	[tiers.t4]
		#Starting multiplier % (100 = 1.0x vanilla)
		#Range: 50.0 ~ 10000.0
		startPct = 600.0
		#Cap multiplier % (must be >= startPct)
		#Range: 50.0 ~ 10000.0
		capPct = 1000.0
		#Hours of dimension-loaded time to reach cap from start.
		#Range: 0.1 ~ 10000.0
		capHours = 200.0
		#Extra multiplier applied ONLY to attack_damage, on top of the start/cap
		#curve (health/armor/speed unaffected). 130 = +30% incoming damage.
		#Range: 50.0 ~ 10000.0
		damageMultiplierPct = 130.0

#Dimension → tier mapping. Anything not listed defaults to t1.
#Resource locations (mod:dimension_id). Source: wiki/progression/overview.md.
[dimensions]
	#T1 dimensions (Overworld).
	t1 = ["minecraft:overworld"]
	#T2 dimensions (Twilight Forest, Blue Skies, Aether).
	t2 = ["twilightforest:twilight_forest", "blue_skies:everbright", "blue_skies:everdawn", "aether:the_aether"]
	#T3 dimensions (Undergarden, Deeper Darker, Nether, Abyss).
	t3 = ["undergarden:undergarden", "deeperdarker:otherside", "minecraft:the_nether", "theabyss:abyss"]
	#T4 dimensions (Deep Aether, The End).
	t4 = ["deep_aether:deep_aether", "minecraft:the_end"]
	#Dimensions whose cap is removed once the Ender Dragon is killed
	#in-world. By default only the End (Deep Aether stays capped at T4).
	uncapAfterEnderDragon = ["minecraft:the_end"]

#Entities to skip (boss IDs, special mobs, mod-broken entities).
#Bosses are also detected automatically via persistent boss tag,
#so this is mainly for non-boss mobs you want exempt.
[excludes]
	#Resource IDs of entities to skip entirely.
	entities = ["minecraft:wither", "minecraft:ender_dragon", "minecraft:elder_guardian", "twilightforest:naga", "twilightforest:lich", "twilightforest:hydra", "twilightforest:knight_phantom", "twilightforest:ur_ghast", "twilightforest:snow_queen", "twilightforest:minoshroom", "twilightforest:alpha_yeti", "twilightforest:final_boss", "aether:slider", "aether:valkyrie_queen", "aether:sun_spirit", "cataclysm:ignis", "cataclysm:netherite_monstrosity", "cataclysm:ender_guardian", "cataclysm:ancient_remnant", "cataclysm:harbinger", "cataclysm:leviathan", "cataclysm:maledictus", "irons_spellbooks:dead_king_boss"]
	#Resource IDs of mobs to scale EVEN IF their registered
	#MobCategory is not MONSTER. Some mods (notably MCreator packs
	#like Terramity) register clearly-hostile mobs under MISC/CREATURE,
	#which makes them slip past the MONSTER-category spawn filter and
	#stay un-scaled — e.g. Terramity's trial_spire towers spawn
	#terramity:dungeon_sentry (registered MISC), so half the tower
	#garrison ignored dimension scaling. List such mobs here to force
	#them through. They still get the normal exclude/boss/owned/
	#already-scaled checks; this ONLY relaxes the category gate.
	#The entity must still be a Mob subclass (projectiles/items are
	#skipped regardless).
	forceScaleEntities = ["terramity:dungeon_sentry"]

#Pause the per-dimension scaling timer when no active players
#are in the dimension. An 'active' player is one who has moved
#(>0.1 blocks), dealt damage, or taken damage within the last
#idleThresholdMinutes. AFK pool farms and idle servers will
#not advance the difficulty timer. Set enabled=false to revert
#to plain time-based scaling regardless of player presence.
[idle_detection]
	#Master toggle.
	enabled = true
	#Minutes a player must be motionless + non-combat to be considered idle.
	#Range: 0.5 ~ 60.0
	idleThresholdMinutes = 5.0
	#Treat players within spawnIdleRadius blocks of their respawn
	#point (bed if set, world spawn otherwise) as idle regardless
	#of activity. Hanging out at base / sleeping / sorting chests
	#shouldn't tick the difficulty timer.
	idleAtSpawnEnabled = true
	#Cube radius (blocks) around respawn point that counts as 'at spawn'.
	#Chebyshev distance — max of |dx|,|dy|,|dz|. 10 = 21x21x21 cube.
	#Range: 1 ~ 256
	spawnIdleRadius = 10

