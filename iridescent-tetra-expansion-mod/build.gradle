plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group
archivesBaseName = mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

compileJava { options.encoding = 'UTF-8' }
javadoc { options.encoding = 'UTF-8' }

minecraft {
    mappings channel: mapping_channel, version: mapping_version
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

repositories {
    mavenCentral()
    flatDir {
        dirs "$projectDir/libs"
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Mixin annotation processor (for the GuiModuleSlotSubheadingMixin
    // inherited from iridescent-reforging-mod).
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // ── Tetra core (both armor + spell-book extensions implement
    //    IModularItem and call into Tetra's UI/data infrastructure)
    compileOnly fg.deobf("blank:tetra:1.20.1-6.12.0")
    compileOnly fg.deobf("blank:mutil:1.20.1-6.3.0")

    // ── Iron's Spellbooks (modspells subclasses ISS SpellBook;
    //    reforging probes ISS armor classes for renderer dispatch)
    compileOnly fg.deobf("blank:irons_spellbooks:1.20.1-3.15.5.1")

    // ── Curios (ISS SpellBook extends CurioBaseItem, so the Java
    //    classloader needs Curios visible at compile time)
    compileOnly fg.deobf("blank:curios-forge:5.14.1-1.20.1")

    // ── Ars Nouveau (modspells subclasses Ars SpellBook for the
    //    iss_book + ars_book module distinction)
    compileOnly fg.deobf("blank:ars_nouveau:1.20.1-4.12.7-all")

    // ── Geckolib (specialized armor renderer dispatch path on the
    //    reforging side; transitive via Ars on the modspells side)
    compileOnly fg.deobf("blank:geckolib-forge:1.20.1-4.8.3")
}

jar {
    manifest {
        attributes([
            "Specification-Title": mod_id,
            "Specification-Vendor": mod_authors,
            "Specification-Version": "1",
            "Implementation-Title": mod_id,
            "Implementation-Version": mod_version,
            "Implementation-Vendor": mod_authors,
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            "MixinConfigs": "${mod_id}.mixins.json"
        ])
    }
    finalizedBy 'reobfJar'
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property "version", mod_version
    // Only pack.mcmeta gets templated; mods.toml is hand-authored with
    // literal mod IDs (TWO `[[mods]]` blocks won't fit a single ${mod_id}
    // substitution).
    filesMatching('pack.mcmeta') {
        expand 'version': mod_version, 'mod_id': mod_id, 'mod_name': mod_name,
               'mod_description': mod_description, 'mod_authors': mod_authors,
               'minecraft_version': minecraft_version, 'forge_version': forge_version
    }
}
