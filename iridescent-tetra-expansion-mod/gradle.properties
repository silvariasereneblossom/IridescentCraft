# Bundled mod properties — single artifact (`iridescent_tetra_expansion-X.Y.Z.jar`)
# but registers TWO Forge mod IDs internally (`iridescent_reforging` +
# `iridescent_modular_spells`) for backwards compatibility with all existing
# in-world stacks. See META-INF/mods.toml for the multi-`[[mods]]` declaration.
mod_id=iridescent_tetra_expansion
mod_name=IridescentCraft Tetra Expansion
mod_version=1.0.0
mod_group=com.iridescentcraft
mod_authors=Silvaria
mod_description=Bundles Iridescent Reforging (Tetra-style modular armor) + Iridescent Modular Spells (Tetra-style modular spell books) into a single jar. Preserves both original mod IDs (iridescent_reforging, iridescent_modular_spells) so existing world stacks survive.

# Minecraft/Forge versions
minecraft_version=1.20.1
forge_version=47.4.6
mapping_channel=official
mapping_version=1.20.1

# Gradle settings
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
