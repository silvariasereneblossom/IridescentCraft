modLoader="javafml"
loaderVersion="[47,)"
license="MIT"
issueTrackerURL="https://github.com/silvariasereneblossom/IridescentCraft/issues"

# Single mixin config for the whole jar. The config file lives at
# iridescent_tetra_expansion.mixins.json with package
# com.iridescentcraft.reforging.mixin (kept verbatim from the standalone
# jar so the @Mixin classes don't need to move).
mixinConfigs=["iridescent_tetra_expansion.mixins.json"]

# ─── Dependency declarations: what belongs here and what does not ────────────
# A dependency is declared mandatory below when this jar's code cannot LOAD
# without it — a class of ours extends / implements one of its classes, or a
# @Mod.EventBusSubscriber class has a handler whose parameter is one of its
# event types (Forge reflects over those methods at startup). With the
# declaration a missing mod gets Forge's "missing dependency" screen; without
# it the game dies in a NoClassDefFoundError.
#
# Deliberately NOT declared: cofh_core and ensorcellation. They are only
# mixin TARGETS (CropBlockCoFHReplantMixin, MagicProtectionHalveMixin). Mixin
# skips a mixin whose target class does not exist ("@Mixin target ... was not
# found", a warning) even in a required config with defaultRequire 1 — that
# setting only governs injectors of mixins that DO apply. Without those mods
# there is simply no CoFH crop / Magic Protection enchant to adjust, so they
# are genuinely optional and must not block startup.
#
# versionRange: permissive [0,) on third-party deps whose Forge-side version
# string carries the MC version prefix ("1.20.1-3.15.5.1"), which Forge's
# Maven-comparator parser misreads as major-version 1.

# ─── Mod 1: iridescent_reforging  (Tetra-style modular armor) ────────────────
# IDs and item registrations preserved from the standalone iridescent-
# reforging-mod-0.1.0.jar so existing world stacks survive the bundle.
[[mods]]
modId="iridescent_reforging"
version="1.0.0"
displayName="Iridescent Tetra Expansion: Reforging"
authors="Silvaria"
credits="Built on Tetra (mickelus, LGPL-3.0). Bridges to Iron's Spellbooks and Ars Nouveau via their public APIs."
description='''Tetra-style modular armor system, shipped as part of the IridescentCraft Tetra Expansion bundle. Extends Tetra's IModularItem to ArmorItem with archetype-coded module alternatives (basic/heavy/light/mage) at 16 slots. Preserves Geckolib renderers and base attributes for specialized armors via NBT-driven skin dispatch.'''

[[dependencies.iridescent_reforging]]
    modId="forge"
    mandatory=true
    versionRange="[47.4.6,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.iridescent_reforging]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1]"
    ordering="NONE"
    side="BOTH"

[[dependencies.iridescent_reforging]]
    modId="tetra"
    mandatory=true
    versionRange="[6.12.0,)"
    ordering="AFTER"
    side="BOTH"

# ItemModularArmor implements Geckolib's GeoItem (needed on the server too:
# the item class is common). Class presence is all that is required, so no
# load-order constraint.
[[dependencies.iridescent_reforging]]
    modId="geckolib"
    mandatory=true
    versionRange="[4,)"
    ordering="NONE"
    side="BOTH"

# Apothic Attributes: PercentRangedAttribute (damage_vs_undead and the
# icraft:spell_power / lifesteal / dodge_chance attributes IcraftAttributes
# registers) implements its IFormattableAttribute. Common class, so BOTH.
[[dependencies.iridescent_reforging]]
    modId="attributeslib"
    mandatory=true
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"

# Iron's Spellbooks: IssRebalanceHandler / ProcEnchantHandler subscribe to its
# SpellOnCastEvent + SpellDamageEvent, and the unified mana pool
# (ArsManaCapMixin) reads its MagicData.
[[dependencies.iridescent_reforging]]
    modId="irons_spellbooks"
    mandatory=true
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# Ars Nouveau: ForgeEventRegistry subscribes to its SpellDamageEvent.Pre.
[[dependencies.iridescent_reforging]]
    modId="ars_nouveau"
    mandatory=true
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# ─── Mod 2: iridescent_modular_spells  (Tetra-style modular spell books) ─────
# IDs and item registrations preserved from the standalone iridescent-
# modular-spells-mod jar.
[[mods]]
modId="iridescent_modular_spells"
version="1.0.0"
displayName="Iridescent Tetra Expansion: Modular Spells"
authors="Silvaria"
credits="Built on Tetra (mickelus, LGPL-3.0). Bridges to Iron's Spellbooks and Ars Nouveau via their public APIs."
description='''Tetra-style modular spell books for Iron's Spellbooks + Ars Nouveau, shipped as part of the IridescentCraft Tetra Expansion bundle. Books implement IModularItem and route attribute aggregation through the Tetra workbench.'''

[[dependencies.iridescent_modular_spells]]
    modId="forge"
    mandatory=true
    versionRange="[47.4.6,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.iridescent_modular_spells]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="BOTH"

[[dependencies.iridescent_modular_spells]]
    modId="irons_spellbooks"
    mandatory=true
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.iridescent_modular_spells]]
    modId="curios"
    mandatory=true
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.iridescent_modular_spells]]
    modId="ars_nouveau"
    mandatory=true
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.iridescent_modular_spells]]
    modId="tetra"
    mandatory=true
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# Apothic Attributes: HidePerkTooltips listens to its
# GatherSkippedAttributeTooltipsEvent. That subscriber is client-only
# (value = Dist.CLIENT), so the dedicated server does not need it for THIS
# mod (iridescent_reforging above needs it on both sides regardless).
[[dependencies.iridescent_modular_spells]]
    modId="attributeslib"
    mandatory=true
    versionRange="[0,)"
    ordering="NONE"
    side="CLIENT"
