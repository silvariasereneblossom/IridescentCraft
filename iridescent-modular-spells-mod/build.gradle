plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

version = mod_version
group = mod_group
archivesBaseName = mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Force UTF-8 source/javadoc encoding so Unicode in comments doesn't trip
// the default-encoding fallback on systems where it's US-ASCII.
compileJava { options.encoding = 'UTF-8' }
javadoc { options.encoding = 'UTF-8' }

minecraft {
    mappings channel: mapping_channel, version: mapping_version
}

repositories {
    mavenCentral()
    // Local jar refs for Tetra + ISS + Ars (Phase 1+). Avoids the maven
    // coordinate dance for these three; libs/ is git-ignored, jars are
    // copied from the iridescent-biomes-mod cache by build_mod.sh if missing.
    flatDir {
        dirs "$projectDir/libs"
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Iron's Spellbooks -- we subclass io.redspace.ironsspellbooks.item.SpellBook
    // for the modular variants, so this is required at compile time.
    // 'compileOnly' because at runtime ISS is loaded normally by Forge.
    // flatDir-resolved so fg.deobf can actually deobfuscate the jar (otherwise
    // gradle warns "files(...) dependencies are not deobfuscated").
    compileOnly fg.deobf("blank:irons_spellbooks:1.20.1-3.15.5.1")
    // Curios -- ISS's SpellBook extends CurioBaseItem. Forge mod jar names
    // use '+' which Gradle treats as a version separator, so we point at
    // the renamed jar via flatDir.
    compileOnly fg.deobf("blank:curios-forge:5.14.1-1.20.1")

    // Phase 3: Ars Nouveau modular spell books. We subclass
    // com.hollingsworth.arsnouveau.common.items.SpellBook so this is required
    // at compile time. flatDir-resolved (jar at libs/) so fg.deobf works.
    compileOnly fg.deobf("blank:ars_nouveau:1.20.1-4.12.7-all")
    // Geckolib is a transitive dep of Ars (SpellBook implements GeoItem).
    // Compile-only since the runtime jar is loaded by the pack.
    compileOnly fg.deobf("blank:geckolib-forge:1.20.1-4.8.3")
    // Tetra deferred to Phase 4+:
    // compileOnly fg.deobf(files("$projectDir/libs/tetra-1.20.1-6.12.0.jar"))
}

jar {
    manifest {
        attributes([
            "Specification-Title": mod_id,
            "Specification-Vendor": mod_authors,
            "Specification-Version": "1",
            "Implementation-Title": mod_id,
            "Implementation-Version": mod_version,
            "Implementation-Vendor": mod_authors,
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property "version", mod_version
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand 'version': mod_version, 'mod_id': mod_id, 'mod_name': mod_name,
               'mod_description': mod_description, 'mod_authors': mod_authors,
               'minecraft_version': minecraft_version, 'forge_version': forge_version
    }
}
