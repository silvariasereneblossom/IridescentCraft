[package]
name = "icraft-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "IridescentCraft server launcher - GUI shell"

# A library (the launcher, `run(extension)`) and the launcher's own binary.
# A build that embeds the launcher depends on the library (see src/ext.rs).
[lib]
name = "icraft_gui"
path = "src/lib.rs"

[[bin]]
name = "icraft-gui"
path = "src/main.rs"

[dependencies]
icraft-core.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
eframe.workspace = true
egui.workspace = true
serde.workspace = true

# Native folder picker. Win-only -- a clean sync Win32 dialog ships
# without extra system deps. On Linux the picker would need GTK3 or
# the xdg-portal async runtime; both are heavier than the alternative
# (a plain text input field that the user pastes/edits the path into).
[target.'cfg(windows)'.dependencies]
rfd = { version = "0.14", default-features = false }
