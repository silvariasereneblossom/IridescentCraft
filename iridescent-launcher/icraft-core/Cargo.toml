[package]
name = "icraft-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "IridescentCraft server launcher - core logic (sync, install, run, diagnose)"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
log.workspace = true
ureq.workspace = true
zip.workspace = true
toml.workspace = true
base64 = "0.22"
# expected_state.json consumer (Phase 0 full-zip deletion pass): the
# manifest stores per-file sha256, so the post-overlay repair check needs
# a real SHA-256. icraft-core's pre-existing hash_file() is only a
# non-cryptographic DefaultHasher (u64) for cheap "did this file change"
# diffs and CANNOT verify against the manifest's hex digests. sha2 is the
# de-facto RustCrypto SHA-256; pure-Rust, no C deps.
sha2 = "0.10"
# Server Customizer (nbt.rs / anvil.rs / png.rs): world files are gzip- or
# zlib-compressed NBT. flate2 is already in the build through `zip`, with the
# same pure-Rust backend (miniz_oxide); naming it here adds no new crate.
flate2 = "1"

# Win32 console mode (disable QuickEdit at startup) + watchdog soft-kick
# (write \r\n to child stdin before the hard kill). Pulled in only on
# Windows targets; Linux/macOS builds don't compile or download this.
[target.'cfg(windows)'.dependencies]
# Win32_System_RemoteDesktop: ProcessIdToSessionId (autostart::session_id).
# Win32_System_RestartManager + Win32_System_Threading: which process has the
# world or the game log open, and the clean stop of one (world_lock.rs).
windows-sys = { version = "0.52", features = ["Win32_System_Console", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_RemoteDesktop", "Win32_System_RestartManager", "Win32_System_Threading"] }
