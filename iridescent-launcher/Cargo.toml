[workspace]
resolver = "2"
members = ["icraft-core", "icraft-cli", "icraft-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["silvariasereneblossom"]
repository = "https://github.com/silvariasereneblossom/IridescentCraft"

[workspace.dependencies]
icraft-core = { path = "icraft-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
