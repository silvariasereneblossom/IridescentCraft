[workspace]
resolver = "2"
members = ["icraft-core", "icraft-cli", "icraft-gui"]
# Default builds skip the GUI -- its eframe + wayland/x11 dep tree is
# heavy and Linux-host disk is tight. Build the GUI explicitly with
# `cargo build -p icraft-gui --release` on the Windows target machine
# (where SmartScreen + native Win32 dialogs are the actual deployment
# story anyway).
default-members = ["icraft-core", "icraft-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["silvariasereneblossom"]
repository = "https://github.com/silvariasereneblossom/IridescentCraft"

[workspace.dependencies]
icraft-core = { path = "icraft-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
log = "0.4"
env_logger = "0.11"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
# Renderer story (revised 2026-05-27):
#   - Dev boxes hit the system OpenGL ICD via glow. Fine.
#   - Server VM has no OpenGL 2.0+ (no GPU passthrough, RDP basic display
#     driver). Glow exits at egui_glow init with "requires opengl 2.0+".
#   - Tried wgpu briefly -- works on dev (Vulkan/DX12) but the server VM
#     also exposes no DX/Vulkan adapter, so wgpu errors with "no adapters".
#   - Settled on Mesa3D software OpenGL: drop `opengl32.dll` +
#     `libgallium_wgl.dll` (from pal1000/mesa-dist-win) next to
#     icraft-gui.exe. Windows resolves opengl32 from the exe dir before
#     system32, so Mesa intercepts and llvmpipe renders on CPU. Works
#     everywhere; no GPU/DX/Vulkan required. See docs/mesa.md.
# Keeping the wgpu feature compiled in so a future env that needs DX
# rendering can flip back without re-touching Cargo.toml.
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow", "wgpu", "persistence"] }
egui = "0.27"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
