# =============================================================================
# Build icraft-gui.exe on GitHub Actions windows-latest and commit it back to
# .minecraft/server_distribution/icraft-gui.exe.
#
# Replaces the "human installs rustup + runs rebuild_gui.bat --push" workflow
# with CI. Per task #48: rationale is that the launcher is meant to ship as a
# binary distribution -- operators on server VMs should never see cargo /
# rustup / "Rebuild + Push GUI" buttons leak into their environment. After
# this workflow ships, the only human action needed for a launcher fix is a
# source-code commit; CI handles the build + deploy.
#
# Triggers:
#   - push to main that touches iridescent-launcher/ (source change -> rebuild
#     needed). Does NOT trigger on commits that only touch the binary at
#     .minecraft/server_distribution/icraft-gui.exe -- that's how we break
#     the infinite-loop risk of CI committing back to a path that retriggers
#     CI.
#   - manual workflow_dispatch (Actions tab -> Run workflow) for forced rebuilds.
#
# Outputs:
#   - icraft-gui-exe artifact (downloadable from Actions UI for ~30 days)
#   - commit-back to repo at .minecraft/server_distribution/icraft-gui.exe
#     (if the new binary differs from what's already there)
#
# Hidden contract: the bot commit message intentionally omits any pack/wiki
# pre-push hook side-effects -- this is a CI push, not a human's, and the
# hooks are configured client-side so they don't fire on bot pushes anyway.
# =============================================================================

name: Build icraft-gui

on:
  push:
    branches: [main]
    paths:
      - 'iridescent-launcher/**'
      - '.github/workflows/build-icraft-gui.yml'
  workflow_dispatch:

# Cancel in-flight build if a newer push lands -- we only care about the most
# recent source.
concurrency:
  group: icraft-gui-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45  # First build pulls hundreds of crates; later runs cache-hit fast.

    permissions:
      # Required so the workflow can git push the rebuilt binary back to main.
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # Use the default GITHUB_TOKEN -- has contents: write per the
          # permissions block above.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Print toolchain versions
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          # windows-latest ships with a recent stable Rust + MSVC toolchain
          # pre-installed, so no rustup-init step needed.

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            iridescent-launcher/target
          key: cargo-${{ runner.os }}-${{ hashFiles('iridescent-launcher/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Build icraft-gui (release)
        working-directory: iridescent-launcher
        run: cargo build -p icraft-gui --release

      - name: Locate built binary via cargo metadata
        id: locate
        working-directory: iridescent-launcher
        shell: pwsh
        run: |
          # Same logic as rebuild_gui.bat: ask cargo where target ended up
          # (in case the runner has CARGO_TARGET_DIR set globally) and find
          # icraft-gui.exe under it.
          $meta = cargo metadata --format-version=1 --no-deps | ConvertFrom-Json
          $exe = Join-Path $meta.target_directory "release\icraft-gui.exe"
          if (-not (Test-Path $exe)) {
              throw "icraft-gui.exe not found at $exe after build."
          }
          $size = (Get-Item $exe).Length
          Write-Host "Built binary: $exe ($size bytes)"
          "exe=$exe" >> $env:GITHUB_OUTPUT

      - name: Stage binary into server_distribution
        shell: pwsh
        run: |
          $src = "${{ steps.locate.outputs.exe }}"
          $dst = ".minecraft\server_distribution\icraft-gui.exe"
          Copy-Item $src $dst -Force
          $size = (Get-Item $dst).Length
          Write-Host "Staged: $dst ($size bytes)"
          # Sidecar hash, committed alongside the exe in the SAME commit.
          # sync.rs::verify_launcher_binary reads this (64 bytes off the raw
          # CDN, no API quota) to answer "is the launcher on disk the one the
          # repo carries at this commit?" without downloading 12 MB to find
          # out. Lowercase hex, ASCII, no trailing newline and NO BOM -- the
          # Rust side validates 64 hex chars and a BOM would fail that.
          $hash = (Get-FileHash $dst -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$dst.sha256" -Value $hash -NoNewline -Encoding ascii
          Write-Host "Staged: $dst.sha256 ($hash)"

      - name: Upload artifact (Actions UI download)
        uses: actions/upload-artifact@v4
        with:
          name: icraft-gui-exe
          path: .minecraft/server_distribution/icraft-gui.exe
          retention-days: 30
          if-no-files-found: error

      - name: Commit + push if binary changed
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ".minecraft/server_distribution/icraft-gui.exe" ".minecraft/server_distribution/icraft-gui.exe.sha256"
          # `git diff --cached --quiet` exits 1 when there are staged changes,
          # 0 when there are none. PowerShell maps non-zero to a falsy
          # $LASTEXITCODE we can branch on.
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
              $sha = $env:GITHUB_SHA.Substring(0, 7)
              git commit -m "icraft-gui: CI rebuild $sha"
              # Push to the branch the workflow ran on. For workflow_dispatch
              # runs that's typically main; for push triggers it's the source
              # branch. github.ref_name resolves to the unqualified branch name.
              #
              # Race-safe: the stamp-head-sha workflow (and any other push) can
              # move main during the ~5min build, so a plain push loses a
              # non-fast-forward race (this exact step failed that way on run
              # 27376581024). The binary commit and the stamp commit touch
              # disjoint paths, so pull --rebase replays the binary commit
              # cleanly. Retry to ride out back-to-back stamps.
              $branch = "${{ github.ref_name }}"
              $pushed = $false
              for ($i = 1; $i -le 5; $i++) {
                  git push origin HEAD:$branch
                  if ($LASTEXITCODE -eq 0) { $pushed = $true; break }
                  Write-Host "Push attempt $i lost the race; rebasing on origin/$branch and retrying..."
                  git fetch origin $branch
                  git rebase "origin/$branch"
                  if ($LASTEXITCODE -ne 0) {
                      git rebase --abort
                      throw "Rebase onto origin/$branch failed (unexpected conflict on the binary commit)."
                  }
              }
              if (-not $pushed) { throw "Failed to push rebuilt binary after 5 attempts." }
              Write-Host "Committed + pushed updated icraft-gui.exe."

              # ---------------------------------------------------------------
              # Re-stamp .icraft_head_sha onto THIS commit.
              #
              # stamp-head-sha.yml cannot do it: GitHub does not trigger
              # workflows for pushes made with the default GITHUB_TOKEN, and
              # that is the token this job pushes with. Verified 2026-09-24 --
              # that Action's entire run history contains no "CI rebuild"
              # commit, and the stamp sat at the SOURCE commit d45815a1 while
              # the exe lived one commit later at 319c6ecd.
              #
              # Consequence when left unstamped: any consumer reading HEAD from
              # the stamp syncs to the source commit and installs the PREVIOUS
              # exe, then matches markers and short-circuits "up to date" on it
              # forever. That is the stale-launcher defect (failure-modes #9).
              # The launcher now reads HEAD from the API so it no longer
              # depends on this, but the stamp is still its fallback -- and a
              # fallback that is wrong by construction is worse than none.
              #
              # Best-effort: the exe is already pushed, so a lost stamp race
              # must not fail the job (the next human push re-stamps anyway).
              $head = (git rev-parse HEAD).Trim()
              Set-Content -Path ".icraft_head_sha" -Value $head -NoNewline -Encoding ascii
              git add ".icraft_head_sha"
              git diff --cached --quiet
              if ($LASTEXITCODE -ne 0) {
                  git commit -m "stamp HEAD $($head.Substring(0,7)) [skip ci]"
                  $stamped = $false
                  for ($i = 1; $i -le 3; $i++) {
                      git push origin HEAD:$branch
                      if ($LASTEXITCODE -eq 0) { $stamped = $true; break }
                      git fetch origin $branch
                      git rebase "origin/$branch"
                      if ($LASTEXITCODE -ne 0) { git rebase --abort; break }
                  }
                  if ($stamped) {
                      Write-Host "Stamped .icraft_head_sha -> $head"
                  } else {
                      Write-Warning "Could not push the HEAD stamp (exe IS pushed). The stamp stays behind until the next push; API readers are unaffected."
                  }
              }
          } else {
              Write-Host "No change to icraft-gui.exe -- binary is byte-identical to repo copy. Nothing to commit."
          }
