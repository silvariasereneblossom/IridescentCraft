name: Heracles quest validator

# Every quest file of the three distributions, held to the shape Heracles really decodes
# (.minecraft/tools/validate_heracles_quests.py; the shape: .minecraft/wiki/design/heracles-json-shape.md).
#
# One task that does not decode empties the WHOLE quest, and the game logs nothing: a quest
# without a task shows in the book and can never be completed. 51 kill tasks written
# "entity": "<id>" (Heracles reads { "type": "<id>" }) left 21 quests in that state and
# reached main, because nothing ran the validator (2026-10-13).
#
# This runs the same check as the pre-push hook, for the pushes that did not go through it
# (another machine, a hook that was never installed, --no-verify), and then plants each
# defect in a temporary tree to prove the validator still refuses it.

on:
  push:
    branches: [main]
    paths:
      - '.minecraft/config/heracles/**'
      - '.minecraft/server_distribution/config/heracles/**'
      - '.minecraft/distribution/client/config/heracles/**'
      - '.minecraft/tools/validate_heracles_quests*.py'
      - '.minecraft/dev/registry/entity_types.txt'
      - '.minecraft/dev/registry/items.txt'
      - '.minecraft/dev/registry/loot_tables.txt'
      - '.minecraft/dev/registry/loot_tables_rejected.txt'
      - '.minecraft/dev/registry/advancements.txt'
      - '.minecraft/kubejs/data/*/loot_tables/**'
      - '.minecraft/server_distribution/kubejs/data/*/loot_tables/**'
      - '.minecraft/distribution/client/kubejs/data/*/loot_tables/**'
      - '.github/workflows/heracles-quests.yml'
  pull_request:
    branches: [main]
    paths:
      - '.minecraft/config/heracles/**'
      - '.minecraft/server_distribution/config/heracles/**'
      - '.minecraft/distribution/client/config/heracles/**'
      - '.minecraft/tools/validate_heracles_quests*.py'
      - '.minecraft/dev/registry/entity_types.txt'
      - '.minecraft/dev/registry/items.txt'
      - '.minecraft/dev/registry/loot_tables.txt'
      - '.minecraft/dev/registry/loot_tables_rejected.txt'
      - '.minecraft/dev/registry/advancements.txt'
      - '.minecraft/kubejs/data/*/loot_tables/**'
      - '.minecraft/server_distribution/kubejs/data/*/loot_tables/**'
      - '.minecraft/distribution/client/kubejs/data/*/loot_tables/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate_heracles_quests.py
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only what the validator reads: the three quest trees, the tool and its test, the lists
      # of the last full-pack boot (entity types, items, loot tables, advancements: every id a
      # task or reward names is checked against them) and the loot tables each distro ships.
      - name: Checkout (quests, validator, registry lists, shipped loot tables)
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /.minecraft/config/heracles/
            /.minecraft/server_distribution/config/heracles/
            /.minecraft/distribution/client/config/heracles/
            /.minecraft/tools/validate_heracles_quests.py
            /.minecraft/tools/validate_heracles_quests_test.py
            /.minecraft/dev/registry/entity_types.txt
            /.minecraft/dev/registry/items.txt
            /.minecraft/dev/registry/loot_tables.txt
            /.minecraft/dev/registry/loot_tables_rejected.txt
            /.minecraft/dev/registry/advancements.txt
            /.minecraft/kubejs/data/*/loot_tables/
            /.minecraft/server_distribution/kubejs/data/*/loot_tables/
            /.minecraft/distribution/client/kubejs/data/*/loot_tables/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # --require-entity-list: without a snapshot list its id check is skipped with a NOTE;
      # here that must be a failure, or a checkout that lost a file would look like a pass.
      - name: Quests of the dev tree
        run: python -I .minecraft/tools/validate_heracles_quests.py .minecraft/config/heracles/quests --require-entity-list
      - name: Quests of the server distribution
        if: always()
        run: python -I .minecraft/tools/validate_heracles_quests.py .minecraft/server_distribution/config/heracles/quests --require-entity-list
      - name: Quests of the client distribution
        if: always()
        run: python -I .minecraft/tools/validate_heracles_quests.py .minecraft/distribution/client/config/heracles/quests --require-entity-list

      # Each past failure is planted in a temporary tree and must be refused.
      - name: The validator still refuses what it exists to refuse
        if: always()
        run: python -I .minecraft/tools/validate_heracles_quests_test.py
