name: Wiki site

# Builds the public site served at https://iridescentcraft.sereneblossom.gay/
# from the GitHub wiki: the Tester Installation Guide as the front page plus
# the player-facing wiki pages listed in site/pages.json. Generator, page list
# and link checker live in site/ (Python standard library only).
#
# The built files are published to the orphan branch `site-build` as one fresh
# commit (force-pushed; the static files plus build.json). The web server
# fetches that branch anonymously and serves it as plain files from its root.
# No push is made when the output is unchanged (build.json aside).
#
# Triggers:
#   - gollum: a page edited on the wiki web UI
#   - workflow_run "Sync wiki": the wiki is regenerated from .minecraft/wiki/ by
#     sync-wiki.yml, whose git push to the wiki does not raise a gollum event
#   - push to main touching site/** or this file; a daily schedule; manual dispatch
#   - pull_request touching site/**: build + link check only, never publishes

on:
  gollum:
  workflow_run:
    workflows: ["Sync wiki"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/wiki-site.yml'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/wiki-site.yml'
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time; a newer run waits instead of racing the force-push.
concurrency:
  group: wiki-site-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    # After "Sync wiki", only rebuild when that sync succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout the generator
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            site
            .minecraft/tools/wiki-sync-manifest.json
          sparse-checkout-cone-mode: false

      - name: Clone the wiki
        run: git clone --filter=blob:none "https://github.com/${GITHUB_REPOSITORY}.wiki.git" wiki

      # A link that matches no wiki page is rendered as plain text and listed
      # in the job summary; it does not fail the build (add --strict for that).
      - name: Build the site
        run: python3 site/build.py --wiki wiki --out site/_build --report "$GITHUB_STEP_SUMMARY"

      - name: Check links
        run: python3 site/linkcheck.py site/_build

      - name: Keep the build for the publish job
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/_build
          retention-days: 3
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Get the build
        uses: actions/download-artifact@v4
        with:
          name: site
          path: out

      - name: Publish to the site-build branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          wiki=$(python3 -c 'import json; print(json.load(open("out/build.json"))["wiki_commit"][:7])')
          cd out
          # A brand-new single commit with no history: the branch only ever
          # holds the current site.
          git init -q -b site-build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Site build from wiki ${wiki} (generator ${GITHUB_SHA::7})"
          if git ls-remote --exit-code --heads "$remote" site-build > /dev/null; then
            git -c http.extraheader="$auth" fetch -q --depth 1 "$remote" refs/heads/site-build
            if git diff --quiet FETCH_HEAD HEAD -- . ':(exclude)build.json'; then
              echo "Site unchanged since the last publish (only build.json differs): nothing pushed." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          git -c http.extraheader="$auth" push -q --force "$remote" HEAD:refs/heads/site-build
          echo "Published $(git rev-parse --short HEAD) (wiki ${wiki}) to the site-build branch." | tee -a "$GITHUB_STEP_SUMMARY"
