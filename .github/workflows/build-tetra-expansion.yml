# =============================================================================
# Build iridescent_tetra_expansion-1.0.0.jar on GitHub Actions Ubuntu runner.
#
# Workaround for task #39 (gradle "Unable to establish loopback connection"
# on the Windows dev host) AND a working release-pipeline foundation for
# when the mod ships standalone -- the artifact this workflow produces is
# byte-equivalent to a clean local build given identical source state.
#
# Triggers:
#   - push to main that touches iridescent-tetra-expansion-mod/
#     (skip noisy commits that only touch .minecraft/, wiki/, etc.)
#   - manual workflow_dispatch (Actions tab -> Run workflow)
#
# Outputs:
#   - "iridescent-tetra-expansion-jar" artifact (downloadable from the run)
#   - 30 day retention; bump if you need longer
#
# Caveat:
#   - libs/ holds compile-time mod dependency jars (Tetra, ISS, Curios, etc.)
#     that aren't tracked in git (binary blobs, redistribution licenses).
#     The "Stage libs" step below stages them from a cache dir if available,
#     or fails with a clear "missing libs" error otherwise. For CI to work,
#     those jars need to be reachable from a stable URL or committed to a
#     private mirror. Initial implementation expects libs/ to either be
#     committed (toggleable via the LIBS_COMMITTED env) or hosted somewhere.
# =============================================================================

name: Build iridescent_tetra_expansion

on:
  push:
    branches: [main]
    paths:
      - 'iridescent-tetra-expansion-mod/**'
      - '.github/workflows/build-tetra-expansion.yml'
  workflow_dispatch:

# Avoid wasting runners: if a new push lands while a build is in flight,
# cancel the old one.
concurrency:
  group: tetra-expansion-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: iridescent-tetra-expansion-mod

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Gradle (caches/ + wrapper/dists)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('iridescent-tetra-expansion-mod/**/*.gradle*', 'iridescent-tetra-expansion-mod/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Stage compile-time libs
        run: |
          mkdir -p libs
          # When libs/ is committed (binary blobs), this step is a no-op +
          # ls listing for transparency. When libs/ is NOT committed, this
          # is where we'd fetch from a private mirror; failing here is
          # informative.
          if [ -f libs/tetra.jar ] && [ -f libs/irons_spellbooks.jar ]; then
            echo "libs/ is populated, skipping fetch."
            ls -lh libs/
          else
            echo "::warning::libs/ is not populated. Build will likely fail."
            echo "Expected jars: tetra, mutil, irons_spellbooks, curios-forge, ars_nouveau, geckolib-forge"
            echo "Either commit libs/ to the repo or wire up a fetch step here."
            ls -la libs/ || true
          fi

      - name: Run data preprocessors
        run: |
          python3 tools/gen_repair_definitions.py
          python3 tools/gen_skin_models.py
          python3 tools/gen_spellbook_icons.py

      - name: Gradle build
        run: ./gradlew build --no-daemon --stacktrace

      - name: List build output
        run: ls -lh build/libs/

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: iridescent-tetra-expansion-jar
          path: iridescent-tetra-expansion-mod/build/libs/*.jar
          retention-days: 30
          if-no-files-found: error
