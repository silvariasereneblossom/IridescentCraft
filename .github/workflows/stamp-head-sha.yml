# Publishes the current main HEAD commit SHA to a flat file (.icraft_head_sha)
# so the icraft launcher + clients can read "what's the latest commit?" from
# the raw.githubusercontent CDN instead of spending an api.github.com request
# (60/hr-per-IP unauth bucket -> intermittent sync skips behind shared IPs).
# See icraft-core/src/github.rs::resolve_head_sha (this file is now its
# FALLBACK, not its primary source -- read the blind spot below).
#
# Loop guard: paths-ignore the stamp file itself (and log-only pushes) so the
# stamp commit never re-triggers this workflow, and log mirrors don't churn it.
#
# KNOWN BLIND SPOT (documented 2026-09-24, failure-modes #9): this workflow can
# never stamp a CI-pushed commit. GitHub does not trigger workflows for pushes
# made with the default GITHUB_TOKEN, which is what build-icraft-gui.yml pushes
# the rebuilt icraft-gui.exe with -- so the stamp stops at the SOURCE commit and
# the exe, which always lands one commit later, is invisible to any consumer
# reading HEAD from this file. That silently shipped a stale launcher twice
# (09-11, 09-23). Two fixes, both live: the launcher reads HEAD from the API
# (github.rs::resolve_head_sha) and treats this file as a loud fallback, and
# build-icraft-gui.yml re-stamps onto its own commit after pushing the exe.
# If you add another workflow that commits shippable content, it must re-stamp
# the same way -- do NOT assume this workflow will notice it.
name: Stamp HEAD SHA

on:
  push:
    branches: [main]
    paths-ignore:
      # NOTE: leading-segment globs anchor to the REPO ROOT. 'TesterLogs/**'
      # only matched a root-level TesterLogs/, but the real ones are nested at
      # .minecraft/server_distribution/TesterLogs/ (and distribution/client/).
      # Result: every "server logs auto-mirror" push slipped past the ignore,
      # ran this workflow, and advanced .icraft_head_sha onto a log-only commit
      # the deployed marker can never reach -> the launcher's "Repo HEAD" badge
      # read "behind" after every Cycle even though zero content changed. Use a
      # '**/'-prefixed glob so it matches the path at any depth.
      - '.icraft_head_sha'
      - '**/logs/**'
      - '**/TesterLogs/**'

permissions:
  contents: write

concurrency:
  group: stamp-head-sha
  cancel-in-progress: true

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write + commit HEAD SHA
        run: |
          printf '%s' "${{ github.sha }}" > .icraft_head_sha
          if git diff --quiet -- .icraft_head_sha; then
            echo "HEAD SHA already current; nothing to stamp."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .icraft_head_sha
          git commit -m "stamp HEAD ${GITHUB_SHA:0:7} [skip ci]"
          git push
