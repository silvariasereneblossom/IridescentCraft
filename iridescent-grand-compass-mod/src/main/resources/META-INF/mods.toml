modLoader="javafml"
loaderVersion="[47,)"
license="MIT"
issueTrackerURL="https://github.com/silvariasereneblossom/IridescentCraft/issues"

# Mixin config registration. The manifest's MixinConfigs attribute alone is
# unreliable in this pack — Sinytra Connector intercepts mixin loading and
# silently drops manifest-only Forge configs (verified on the durability clamp).
# Declaring it here is what Forge 1.20.1 actually honors.
mixinConfigs=["iridescent_grand_compass.mixins.json"]

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="[${forge_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="[${minecraft_version},1.21)"
    ordering="NONE"
    side="BOTH"

# Must load AFTER the two compass mods so their classes exist for our use()
# delegation + the ItemUtils mixins.
[[dependencies.${mod_id}]]
    modId="explorerscompass"
    mandatory=true
    versionRange="[1.3,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="naturescompass"
    mandatory=true
    versionRange="[1.11,)"
    ordering="AFTER"
    side="BOTH"
