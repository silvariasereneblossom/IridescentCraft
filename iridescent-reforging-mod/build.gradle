plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group
archivesBaseName = mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

compileJava { options.encoding = 'UTF-8' }
javadoc { options.encoding = 'UTF-8' }

minecraft {
    mappings channel: mapping_channel, version: mapping_version
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

repositories {
    mavenCentral()
    flatDir {
        dirs "$projectDir/libs"
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Mixin annotation processor — Forge ships MixinExtras at runtime; only
    // the annotations + processor are needed at compile time. Required for
    // GuiModule slot-subheading injection.
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Tetra: we implement se.mickelus.tetra.items.modular.IModularItem on
    // an ArmorItem subclass so Tetra's WorkbenchTile picks our items up.
    compileOnly fg.deobf("blank:tetra:1.20.1-6.12.0")
    // Tetra-mutil: data-loading helpers (DataStore) Tetra brings transitively
    // at runtime but we need at compile time for any data-API touchpoints.
    compileOnly fg.deobf("blank:mutil:1.20.1-6.3.0")

    // Geckolib: phase 6 requires per-skin Geckolib renderer dispatch via
    // IClientItemExtensions.getHumanoidArmorModel. Compile-only since the
    // pack loads geckolib normally at runtime.
    compileOnly fg.deobf("blank:geckolib-forge:1.20.1-4.8.3")

    // Iron's Spellbooks: phase 7 conversion recipes consume ISS armor items.
    // We probe ISS armor classes (CultistArmorItem etc.) for renderer
    // delegation in phase 6.
    compileOnly fg.deobf("blank:irons_spellbooks:1.20.1-3.15.5.1")
}

jar {
    manifest {
        attributes([
            "Specification-Title": mod_id,
            "Specification-Vendor": mod_authors,
            "Specification-Version": "1",
            "Implementation-Title": mod_id,
            "Implementation-Version": mod_version,
            "Implementation-Vendor": mod_authors,
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            "MixinConfigs": "${mod_id}.mixins.json"
        ])
    }
    finalizedBy 'reobfJar'
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property "version", mod_version
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand 'version': mod_version, 'mod_id': mod_id, 'mod_name': mod_name,
               'mod_description': mod_description, 'mod_authors': mod_authors,
               'minecraft_version': minecraft_version, 'forge_version': forge_version
    }
}
