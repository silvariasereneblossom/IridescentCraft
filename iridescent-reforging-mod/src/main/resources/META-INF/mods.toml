modLoader="javafml"
loaderVersion="[47,)"
license="All Rights Reserved"

# Mixin config — registers GuiModuleSlotSubheadingMixin so minor module
# slots in Tetra's workbench show a slot label header (matching majors).
mixinConfigs=["${mod_id}.mixins.json"]

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
authors="Silvaria"
credits="Built on Tetra (mickelus, LGPL-3.0). Tetra is a runtime dependency, not derived code."
description='''Tetra-style modular armor for IridescentCraft. Original code; depends on Tetra (mickelus) at runtime.'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="[${forge_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="[${minecraft_version}]"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="tetra"
    mandatory=true
    versionRange="[6.12.0,)"
    ordering="AFTER"
    side="BOTH"
